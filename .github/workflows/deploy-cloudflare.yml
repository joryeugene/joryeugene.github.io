name: deploy Cloudflare preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:sync
      - run: npm run lint:prose
      - run: npm run test:georgie-model
      - run: npm run test:worker
      - run: npx playwright test --workers=1
      - run: npm run build:site
      - run: npm run test:site-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site-dist
          path: site-dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site-dist
          path: site-dist/
      - run: npx wrangler pages deploy --cwd cloudflare-pages --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
