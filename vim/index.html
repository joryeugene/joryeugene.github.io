<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phalene Vim - jorypestorious.com</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0c0c0c;
      color: #cdd6f4;
      font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace;
      font-size: 14px;
      line-height: 21px;
      overflow: hidden;
    }

    #vim-editor {
      display: flex;
      flex-direction: column;
      height: 100vh;
      animation: vim-fadein 0.25s ease-in;
    }

    @keyframes vim-fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #vim-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      min-height: 0;
      position: relative;
      isolation: isolate;
    }

    #vim-gutter {
      display: block;
      min-width: 2ch;
      padding: 0 8px 0 0;
      text-align: left;
      color: rgba(255,255,255,0.25);
      user-select: none;
      flex-shrink: 0;
      background: #0c0c0c;
      white-space: pre;
      font: inherit;
    }

    #vim-lines-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
      z-index: 1;
    }

    #vim-editor.dashboard #vim-body {
      background:
        radial-gradient(circle at 14% 24%, rgba(137, 118, 214, 0.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 78% 38%, rgba(0, 210, 255, 0.75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 64% 76%, rgba(255, 184, 0, 0.65) 0 1px, transparent 1.5px);
      background-size: 83px 67px, 109px 89px, 151px 127px;
      background-position: var(--vim-far-x, 0) var(--vim-far-y, 0);
    }

    #vim-editor.dashboard #vim-body::before,
    #vim-editor.dashboard #vim-body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #vim-editor.dashboard #vim-body::before {
      opacity: 0.34;
      background:
        radial-gradient(circle, rgba(164, 145, 235, 0.75) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(79, 209, 255, 0.6) 0 1px, transparent 1.4px);
      background-size: 137px 113px, 191px 157px;
      background-position: var(--vim-mid-x, 0) var(--vim-mid-y, 0);
    }

    #vim-editor.dashboard #vim-body::after {
      opacity: 0.28;
      background:
        radial-gradient(circle, rgba(103, 232, 249, 0.8) 0 1.5px, transparent 2px),
        radial-gradient(circle, rgba(251, 191, 36, 0.8) 0 1.5px, transparent 2px);
      background-size: 263px 211px, 347px 281px;
      background-position: var(--vim-near-x, 31px) var(--vim-near-y, 47px);
    }

    #vim-editor.zen #vim-lines-wrap {
      flex: none;
      width: 65ch;
      max-width: 100%;
      margin: 0 auto;
    }

    #vim-content {
      margin: 0;
      padding: 0 0 0 8px;
      white-space: pre;
      min-height: 100%;
      font: inherit;
      position: relative;
      z-index: 1;
    }

    #vim-dashboard-pet {
      display: none;
      position: fixed;
      z-index: 2;
      top: clamp(88px, 13vh, 112px);
      left: calc(50vw + 2px);
      width: clamp(140px, 16vw, 180px);
      transform: translateX(-50%);
      image-rendering: pixelated;
      filter: drop-shadow(0 0 18px rgba(199, 120, 69, 0.22));
      pointer-events: none;
    }

    #vim-editor.dashboard #vim-dashboard-pet { display: block; }

    .vim-dashboard-title { color: #fff; font-weight: 800; text-shadow: 0 0 16px rgba(167, 139, 250, 0.35); }
    .vim-dashboard-command { color: #67e8f9; font-weight: 700; }
    .vim-dashboard-description { color: #a8aec8; }
    .vim-dashboard-move { color: #f4f1ff; font-weight: 700; text-shadow: 0 0 12px rgba(103, 232, 249, 0.35); }

    #vim-editor.zen #vim-content {
      line-height: 24px;
    }

    #vim-cursor {
      position: absolute;
      background: rgba(205, 214, 244, 0.85);
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 1;
    }

    #vim-cmdline {
      min-height: 21px;
      padding: 0 8px;
      font: inherit;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      flex-shrink: 0;
    }

    #vim-statusbar {
      background: rgba(255,255,255,0.12);
      display: flex;
      justify-content: space-between;
      padding: 2px 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      flex-shrink: 0;
      user-select: none;
    }

    mark {
      background: var(--vim-mark, rgba(255, 200, 0, 0.35));
      color: inherit;
    }

    .vsel {
      background: var(--vim-sel, rgba(100, 150, 255, 0.4));
      color: inherit;
    }

    #vim-palette {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: start center;
      padding-top: min(18vh, 160px);
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(4px);
    }

    #vim-palette[hidden] { display: none; }

    .vim-palette-panel {
      width: min(620px, calc(100vw - 32px));
      overflow: hidden;
      border: 1px solid rgba(167, 139, 250, 0.48);
      border-radius: 10px;
      background: rgba(15, 15, 24, 0.97);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 36px rgba(91, 72, 170, 0.18);
    }

    .vim-palette-label {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px 4px;
      color: #8b7bd6;
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    #vim-palette-input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      outline: 0;
      padding: 8px 14px 12px;
      background: transparent;
      color: #f4f1ff;
      caret-color: #67e8f9;
      font: inherit;
      font-size: 17px;
    }

    #vim-palette-results {
      max-height: min(430px, 55vh);
      overflow-y: auto;
      padding: 6px;
    }

    .vim-palette-item {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 24px;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      background: transparent;
      color: #cdd6f4;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .vim-palette-item span:last-child { color: #6f6b82; }
    .vim-palette-item.active { background: rgba(137, 118, 214, 0.2); color: #fff; }
    .vim-palette-empty { padding: 20px 10px; color: #6f6b82; text-align: center; }
    .vim-snake-head { color: #67e8f9; text-shadow: 0 0 8px #67e8f9; }
    .vim-snake-body { color: #8b7bd6; }
    .vim-snake-food { color: #fbbf24; text-shadow: 0 0 8px #fbbf24; }

    #vim-editor.vim-touch #vim-statusbar,
    #vim-editor.vim-touch #vim-cmdline {
      animation: vim-touch 180ms ease-out;
    }

    @keyframes vim-touch {
      45% {
        color: #ecfeff;
        background-color: rgba(34, 211, 238, 0.18);
        box-shadow: 0 -2px 18px rgba(34, 211, 238, 0.2);
        transform: translateY(-1px);
      }
    }

    #vim-moth {
      --moth-rx: 0deg;
      --moth-ry: 0deg;
      --moth-rz: 0deg;
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 900px;
      background:
        radial-gradient(circle at 50% 45%, rgba(74, 53, 130, 0.28), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(8, 145, 178, 0.12), transparent 48%),
        #07070b;
    }

    #vim-moth[hidden] { display: none; }

    .vim-moth-stage {
      width: min(920px, 96vw);
      transform-style: preserve-3d;
      text-align: center;
    }

    .vim-moth-model {
      position: relative;
      width: 100%;
      transform: rotateX(var(--moth-rx)) rotateY(var(--moth-ry)) rotateZ(var(--moth-rz));
      transition: transform 65ms ease-out;
      transform-style: preserve-3d;
      will-change: transform;
    }

    #vim-moth-svg {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      max-height: 72vh;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(103, 232, 249, 0.12));
    }

    .vim-moth-wing-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 14px rgba(103, 232, 249, 0.12));
      transform-style: preserve-3d;
      backface-visibility: visible;
    }

    .vim-moth-wire {
      fill: none;
      stroke: #8b7bd6;
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
      transform-origin: 400px 255px;
      transition: opacity 360ms ease, transform 420ms cubic-bezier(.2,.8,.2,1);
    }

    .vim-moth-wing { opacity: 0.82; }
    .vim-moth-wing-edge { stroke: #67e8f9; stroke-width: 2; }
    .vim-moth-vein { stroke: #7567b8; stroke-dasharray: 4 9; animation: moth-current 8s linear infinite; }
    .vim-moth-core { stroke: #f4f1ff; stroke-width: 2.2; }
    .vim-moth-node { fill: #fbbf24; stroke: none; filter: drop-shadow(0 0 4px #fbbf24); }
    .vim-moth-energy { stroke: rgba(103, 232, 249, 0.34); stroke-dasharray: 3 13; }

    @keyframes moth-current { to { stroke-dashoffset: -52; } }

    #vim-moth.ripple .vim-moth-wire {
      animation: moth-ripple 520ms ease-out;
    }

    @keyframes moth-ripple {
      28% { opacity: 1; filter: drop-shadow(0 0 12px rgba(103, 232, 249, 0.9)); }
      62% { filter: drop-shadow(0 0 18px rgba(139, 123, 214, 0.75)); }
    }

    #vim-moth.ripple .vim-moth-energy { animation: moth-key-wave 520ms ease-out; }

    @keyframes moth-key-wave {
      50% { opacity: 1; stroke: #67e8f9; stroke-width: 2.5; }
    }

    #vim-moth.moving .vim-moth-core {
      stroke: #67e8f9;
      filter: drop-shadow(0 0 5px rgba(103, 232, 249, 0.8));
    }

    #vim-moth.pulse .vim-moth-energy {
      animation: moth-pulse 620ms ease-out;
      transform-origin: 400px 255px;
    }

    .vim-moth-flap {
      transform-style: preserve-3d;
      backface-visibility: visible;
    }

    .vim-moth-flap-left { transform-origin: 48.75% 50%; }
    .vim-moth-flap-right { transform-origin: 51.25% 50%; }

    #vim-moth.pulse .vim-moth-flap-left { animation: moth-flap-left 760ms cubic-bezier(.2,.8,.2,1); }
    #vim-moth.pulse .vim-moth-flap-right { animation: moth-flap-right 760ms cubic-bezier(.2,.8,.2,1); }

    @keyframes moth-flap-left {
      0%, 100% { transform: rotateY(0); }
      24% { transform: rotateY(62deg); }
      46% { transform: rotateY(-10deg); }
      68% { transform: rotateY(40deg); }
      86% { transform: rotateY(-4deg); }
    }

    @keyframes moth-flap-right {
      0%, 100% { transform: rotateY(0); }
      24% { transform: rotateY(-62deg); }
      46% { transform: rotateY(10deg); }
      68% { transform: rotateY(-40deg); }
      86% { transform: rotateY(4deg); }
    }

    @keyframes moth-pulse {
      55% { opacity: 1; stroke: #67e8f9; stroke-width: 4; transform: scale(1.12); }
      to { opacity: 0.25; transform: scale(1.25); }
    }

    .vim-moth-georgie {
      opacity: 0;
      transform: translate(330px, 180px) scale(0.18);
      transform-origin: 70px 70px;
      transition: opacity 260ms 140ms ease, transform 420ms cubic-bezier(.2,.8,.2,1);
      image-rendering: pixelated;
    }

    #vim-moth.closing .vim-moth-wire { opacity: 0; transform: scale(0.08) rotate(14deg); }
    #vim-moth.closing .vim-moth-georgie { opacity: 1; transform: translate(330px, 180px) scale(1); }

    .vim-moth-copy {
      display: grid;
      gap: 4px;
      margin-top: -10px;
      color: #85819a;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .vim-moth-copy strong { color: #f4f1ff; font-size: 14px; letter-spacing: 0.16em; }
    .vim-moth-copy kbd { color: #67e8f9; font: inherit; font-weight: 700; }

    @media (max-width: 640px) {
      html, body { font-size: 12px; line-height: 18px; }
      #vim-statusbar { font-size: 10px; }
      #vim-editor.dashboard #vim-body { background-size: 61px 47px, 79px 67px, 101px 83px; }
      .vim-moth-stage { width: 100vw; }
      .vim-moth-model { width: 108vw; margin-left: -4vw; }
      .vim-moth-copy { padding: 0 18px; font-size: 10px; letter-spacing: 0.04em; }
      .vim-moth-copy span { max-width: 310px; margin: 0 auto; }
      .vim-moth-copy strong { font-size: 12px; }
    }

    @media (max-height: 680px) {
      #vim-dashboard-pet { top: 60px; width: 120px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #vim-editor { animation: none; }
      #vim-editor.vim-touch #vim-statusbar,
      #vim-editor.vim-touch #vim-cmdline,
      .vim-moth-vein,
      #vim-moth.ripple .vim-moth-wire,
      #vim-moth.ripple .vim-moth-energy,
      #vim-moth.pulse .vim-moth-energy,
      #vim-moth.pulse .vim-moth-flap { animation: none; }
      .vim-moth-model,
      .vim-moth-wire,
      .vim-moth-georgie { transition: none; }
    }
  </style>
</head>
<body>
  <div id="vim-editor">
    <div id="vim-body">
      <div id="vim-gutter"></div>
      <div id="vim-lines-wrap">
        <img id="vim-dashboard-pet" src="/svg/georgie-pixel.svg" alt="">
        <pre id="vim-content"></pre>
        <div id="vim-cursor"></div>
      </div>
    </div>
    <div id="vim-cmdline"></div>
    <div id="vim-statusbar">
      <span id="vim-status-mode"></span>
      <span id="vim-status-file"></span>
      <span id="vim-status-pos"></span>
    </div>
  </div>
  <div id="vim-palette" hidden role="dialog" aria-modal="true" aria-labelledby="vim-palette-title">
    <div class="vim-palette-panel">
      <label class="vim-palette-label" id="vim-palette-title" for="vim-palette-input">
        <span>COMMAND PALETTE</span><span>CTRL P · ESC</span>
      </label>
      <input id="vim-palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="Type an action or Vim command…">
      <div id="vim-palette-results" role="listbox"></div>
    </div>
  </div>
  <div id="vim-moth" hidden role="dialog" aria-modal="true" aria-labelledby="vim-moth-title">
    <div class="vim-moth-stage">
      <div class="vim-moth-model">
        <svg id="vim-moth-svg" viewBox="0 0 800 510" role="img" aria-label="A kinetic wireframe Phalene moth">
          <defs>
            <g id="vim-moth-half">
              <path class="vim-moth-wing vim-moth-wing-edge" d="M390 176 L326 88 L195 42 L76 138 L168 238 L78 345 L228 456 L382 318 Z"/>
              <path class="vim-moth-wing vim-moth-vein" d="M382 190 L326 88 M375 215 L195 42 M370 238 L76 138 M371 260 L168 238 M374 280 L78 345 M379 302 L228 456"/>
              <path class="vim-moth-wing" d="M326 88 L281 188 L195 42 M281 188 L168 238 L76 138 M281 188 L371 260 M168 238 L201 349 L78 345 M201 349 L228 456 L374 280"/>
              <path class="vim-moth-wing" d="M281 188 L195 155 L168 238 M201 349 L292 327 L228 456 M292 327 L371 260"/>
              <circle class="vim-moth-node" cx="76" cy="138" r="4"/>
              <circle class="vim-moth-node" cx="78" cy="345" r="3"/>
              <circle class="vim-moth-node" cx="228" cy="456" r="4"/>
            </g>
          </defs>
          <g class="vim-moth-wire">
            <circle class="vim-moth-energy" cx="400" cy="255" r="92"/>
            <circle class="vim-moth-energy" cx="400" cy="255" r="154"/>
            <path class="vim-moth-core" d="M400 106 C378 145 379 205 392 249 C378 304 385 373 400 417 C415 373 422 304 408 249 C421 205 422 145 400 106 Z"/>
            <path class="vim-moth-core" d="M396 111 Q356 67 337 87 M404 111 Q444 67 463 87"/>
            <path class="vim-moth-vein" d="M400 128 L400 400 M378 160 L422 160 M384 208 L416 208 M384 304 L416 304 M391 360 L409 360"/>
            <circle class="vim-moth-node" cx="400" cy="105" r="5"/>
            <circle class="vim-moth-node" cx="400" cy="417" r="4"/>
          </g>
          <image class="vim-moth-georgie" href="/svg/georgie-pixel.svg" width="140" height="140"/>
        </svg>
        <svg class="vim-moth-wing-layer vim-moth-flap vim-moth-flap-left" viewBox="0 0 800 510" aria-hidden="true">
          <g class="vim-moth-wire"><use href="#vim-moth-half"/></g>
        </svg>
        <svg class="vim-moth-wing-layer vim-moth-flap vim-moth-flap-right" viewBox="0 0 800 510" aria-hidden="true">
          <g class="vim-moth-wire"><use href="#vim-moth-half" transform="translate(800 0) scale(-1 1)"/></g>
        </svg>
      </div>
      <div class="vim-moth-copy">
        <strong id="vim-moth-title">PHALENE // KINETIC FIELD</strong>
        <span>hold/chord <kbd>hjkl</kbd> + <kbd>q/e</kbd> roll · any key ripples · <kbd>Enter</kbd> flaps · <kbd>Esc</kbd> returns</span>
      </div>
    </div>
  </div>
  <script src="/js/vim-themes.js"></script>
  <script src="/js/vim-shell.js"></script>
  <script src="/js/vim-help.js"></script>
  <script src="/js/vim-tutor.js"></script>
  <script src="/js/vim.js"></script>
</body>
</html>
